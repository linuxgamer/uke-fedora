{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "alsa_output.platform-sound-uke.pro-output-1"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 2000,
          "priority.driver": 2000,
          "node.description": "Xiaomi Pad 7 Internal Speakers"
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "alsa_output.platform-sound-uke.pro-output-0"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 500,
          "priority.driver": 500,
          "node.description": "Xiaomi Pad 7 DisplayPort Audio"
        }
      }
    }
  ]
}
