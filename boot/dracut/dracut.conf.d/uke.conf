# Generic initramfs: root находится по root=UUID= из vendor_boot cmdline.
hostonly="no"
compress="gzip"
# Root storage (UFS) и simplefb встроены в ядро (=y); gadget — модулями.
add_drivers+=" configfs libcomposite usb_f_rndis dwc3 dwc3-qcom phy-qcom-eusb2-repeater "
# GPU firmware: Adreno драйвер встроен и пробуется в initramfs (до root).
install_items+=" /usr/lib/firmware/qcom/sm7675/gen71100_zap.mbn /usr/lib/firmware/qcom/sm7675/gen71100_gmu.bin "
