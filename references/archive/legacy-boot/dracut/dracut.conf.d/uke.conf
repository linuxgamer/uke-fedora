# Generic initramfs: the root comes from root=UUID= in the vendor_boot command line.
hostonly="no"
compress="gzip"
# Root storage (UFS) and simplefb are built into the kernel (=y); gadget support uses modules.
add_drivers+=" configfs libcomposite usb_f_rndis dwc3 dwc3-qcom phy-qcom-eusb2-repeater "
# GPU firmware: the built-in Adreno driver probes in the initramfs before the rootfs.
install_items+=" /usr/lib/firmware/qcom/sm7675/gen71100_zap.mbn /usr/lib/firmware/qcom/sm7675/gen71100_gmu.bin "
