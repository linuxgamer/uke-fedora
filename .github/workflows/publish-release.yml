name: Publish run images as release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run id containing the uke-images artifact
        required: true
      tag:
        description: Release tag to create
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools

      - name: Download artifacts from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "uke-images-${{ inputs.run_id }}" --dir assets
          find assets -maxdepth 3 -type f | sort

      - name: Split archives that exceed the release asset limit
        run: |
          set -Eeuo pipefail
          # Runs packed after the splitter landed already ship parts; copy those
          # as they are so their checksums keep covering every asset.
          part=$(find assets -name '*.tar.zst.part-00' -print -quit)
          if [[ -n $part ]]; then
            cp -a "$(dirname "$part")" publish
          else
            archive=$(find assets -name '*.tar.zst' -print -quit)
            [[ -n $archive ]] || { echo 'No release archive in the artifact' >&2; exit 1; }
            ./tools/split-release-assets.sh --input "$(dirname "$archive")" --output publish
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uke Fedora ${{ inputs.tag }}" \
            --notes-file publish/README.txt
