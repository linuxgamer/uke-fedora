name: Publish run images as release

# Manual only. This packages whatever a finished build uploaded, whatever that
# build concluded: a run that failed late - audit, release creation, a cache
# save - has already produced the images, and publishing them is a decision for
# the person dispatching this, not for the workflow. Nothing here reads the
# source run's status.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run id containing the uke-images artifact
        required: true
      tag:
        description: Release tag to create
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools

      - name: Download artifacts from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "uke-images-${{ inputs.run_id }}" --dir assets
          find assets -maxdepth 3 -type f | sort

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd

      - name: Pack the uploaded images into release archives
        env:
          # Same settings as the build's packaging step: level 12 keeps most of
          # the saving at half the time, and the splitter takes care of whatever
          # still exceeds the release asset limit.
          ZSTD_CLEVEL: '12'
          ZSTD_NBTHREADS: '4'
        run: |
          ./tools/pack-run-images.sh --run-id "${{ inputs.run_id }}" \
            --tag "${{ inputs.tag }}" --output archives assets

      - name: Split archives that exceed the release asset limit
        run: ./tools/split-release-assets.sh --input archives --output publish

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uke Fedora ${{ inputs.tag }}" \
            --notes-file publish/README.txt
