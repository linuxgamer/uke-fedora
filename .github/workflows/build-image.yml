name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated profiles
        required: true
        default: tty
        type: string
      video_overlay:
        description: Apply the native Cliffs video overlay
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
      parallel:
        description: Build up to N desktop profiles at once
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4"]
      package_release:
        description: Create release archives
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      release_tag:
        description: Optional release tag
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record component pins
        id: pins
        run: |
          {
            echo "kernel=$(git -C senemos-uke-kernel rev-parse HEAD)"
            echo "builder=$(git -C uke-fedora-builder rev-parse HEAD)"
            echo "hardware=$(git -C uke-linux-hardware-support rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # --- THE ONE-SHOT FIX ---
      - name: Patch broken submodules in CI
        run: |
          # 1. Fix uke-core-meta infinite loop
          sed -i "s/if \[\[ '\$(FEDORA44_LEGACY)' == 1 \]\]; then/if [[ '0' == '1' ]]; then/g" uke-linux-hardware-support/uke-core-meta/Makefile

          # 2. Fix uke-sensors Makefile variable scope
          sed -i 's|\$\$top|/work/uke-linux-hardware-support/uke-sensors/build/rpmbuild|g' uke-linux-hardware-support/uke-sensors/Makefile

          # 3. Fix uke-sensors spec file (remove malformed %else, strip undefined systemd macros)
          SPEC=uke-linux-hardware-support/uke-sensors/packaging/uke-touchscreen.spec
          sed -i '/^%if 0%{?fedora}/,/%endif/c\%global uke_cxx_runtime libstdc++' "$SPEC"
          sed -i 's/%systemd_post/systemctl preset/g' "$SPEC"
          sed -i 's/%systemd_preun/systemctl disable/g' "$SPEC"
          sed -i 's/%systemd_postun_with_restart/systemctl try-restart/g' "$SPEC"
          sed -i 's|%{_unitdir}|/usr/lib/systemd/system|g' "$SPEC"
      # --- END FIX ---

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            senemos-uke-kernel/source-cache
            uke-fedora-builder/build/cache
            ~/.cache/ccache
            ~/.cache/docker
          key: uke-cache-${{ steps.pins.outputs.kernel }}-${{ steps.pins.outputs.builder }}
          restore-keys: |
            uke-cache-${{ steps.pins.outputs.kernel }}-
            uke-cache-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd g++ python3 e2fsprogs curl ca-certificates
          curl -fsSL 'https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT' \
            | base64 -d | sudo tee /usr/local/bin/avbtool >/dev/null
          sudo chmod +x /usr/local/bin/avbtool
          avbtool --help >/dev/null

      - name: Resolve inputs
        run: |
          set -Eeuo pipefail
          echo "PROFILES=${{ inputs.profiles || 'tty' }}"                >> "$GITHUB_ENV"
          echo "VIDEO_OVERLAY=${{ inputs.video_overlay || '0' }}"       >> "$GITHUB_ENV"
          echo "PARALLEL=${{ inputs.parallel || '1' }}"                 >> "$GITHUB_ENV"
          echo "PACKAGE_RELEASE=${{ inputs.package_release || 'yes' }}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${{ inputs.release_tag || '' }}"            >> "$GITHUB_ENV"

      - name: Validate inputs
        run: |
          set -Eeuo pipefail
          [[ $PROFILES =~ ^[a-z-]+(,[a-z-]+)*$ ]] || { echo "Invalid profiles list"; exit 1; }
          if [[ $PACKAGE_RELEASE == 'no' && -n $RELEASE_TAG ]]; then
            echo "release_tag was provided but package_release is 'no'."; exit 1
          fi

      - name: Build image pairs
        env:
          UKE_VIDEO_OVERLAY: ${{ env.VIDEO_OVERLAY }}
          UKE_CONTAINER: docker
        run: |
          set -Eeuo pipefail
          output="build/ci-$GITHUB_RUN_ID"
          mkdir -p build
          ./ukelinux.sh --profiles "$PROFILES" --parallel "$PARALLEL" --output "$output"

      - name: Package release archives
        if: success() && env.PACKAGE_RELEASE == 'yes'
        run: |
          set -Eeuo pipefail
          tag=${RELEASE_TAG:-ci-$GITHUB_RUN_ID}
          ./uke-fedora-builder/tools/package-release.sh --tag "$tag" \
            --output "build/release-$tag" build/ci-$GITHUB_RUN_ID/*-pair

      - name: Upload image artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-images-${{ github.run_id }}
          path: |
            build/ci-*/status.json
            build/ci-*/*-pair/fedora_boot.img
            build/ci-*/*-pair/userdata.img
            build/ci-*/*-pair/SHA256SUMS
            build/ci-*/build.log
            build/release-*/*.tar.zst
            build/release-*/SHA256SUMS
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

      - name: Publish release
        if: success() && env.PACKAGE_RELEASE == 'yes' && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=$RELEASE_TAG
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "$tag" --notes "Automated Uke image build."
          shopt -s nullglob
          assets=(build/release-"$tag"/*.tar.zst build/release-"$tag"/SHA256SUMS)
          ((${#assets[@]})) || { echo 'No release archives to upload' >&2; exit 1; }
          gh release upload "$tag" "${assets[@]}" --clobber

      - name: Summary
        if: always()
        run: |
          {
            echo '## Uke image build'
            echo "- profiles: \`$PROFILES\`"
            echo "- result: \`${{ job.status }}\`"
            if compgen -G 'build/release-*' >/dev/null; then
              echo '```'
              cat build/release-*/SHA256SUMS 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
