name: Kernel build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to (required)"
        default: ""
        type: string
env:
  KVER: 7.2.0-rc2-uke
permissions:
  contents: write
jobs:
  build-kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Require a release tag
        run: '[ -n "${{ inputs.release_tag }}" ] || { echo "release_tag required" >&2; exit 1; }'
      - uses: actions/checkout@v4
      - name: Build kernel RPM, initramfs and boot bundle
        run: |
          docker run --rm -e KVER -v "$PWD:/work" -w /work quay.io/fedora/fedora:44 bash -lc '
            set -euxo pipefail
            dnf -y install make gcc clang lld llvm bc flex bison perl openssl openssl-devel \
                elfutils-libelf-devel python3 tar xz zstd rpm-build ccache dtc findutils \
                dwarves dracut cpio lz4 iproute git >/dev/null
            git clone --depth 1 --branch palawan/v7.2-rc2 \
                https://codeberg.org/palawan-mainline/linux.git linux-prepared
            bash /work/kernel/prepare.sh linux-prepared
            tar czf linux-prepared.tar.gz linux-prepared && rm -rf linux-prepared
            mkdir -p ~/rpmbuild/SOURCES out-kernel out-bundle
            cp linux-prepared.tar.gz ~/rpmbuild/SOURCES/
            rpmbuild -bb --define "kversion 7.2.0-rc2" /work/kernel/kernel.spec
            cp ~/rpmbuild/RPMS/aarch64/*.rpm out-kernel/
            dnf -y install out-kernel/*.rpm
            tar xzf /work/rootfs/firmware.tar.gz -C /usr 2>/dev/null || true
            cp -a /work/boot/dracut/90uke-usbnet /usr/lib/dracut/modules.d/
            cp /work/boot/dracut/dracut.conf.d/uke.conf /usr/lib/dracut/dracut.conf.d/
            dracut --kver "$KVER" --force /tmp/initramfs.img
            bash /work/boot/build-bundle.sh \
                --image "/boot/vmlinuz-$KVER" \
                --dtb "/boot/dtbs-$KVER/qcom/sm7675-xiaomi-uke.dtb" \
                --initramfs /tmp/initramfs.img \
                --cmdline /work/boot/cmdline.txt \
                --bootconfig /work/boot/bootconfig.txt \
                --out out-bundle
          '
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ inputs.release_tag }}
        run: |
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --title "$REL" --notes "CI build"
          mv out-bundle/SHA256SUMS out-bundle/BUNDLE-SHA256SUMS
          gh release upload "$REL" --clobber out-kernel/*.rpm out-bundle/*.img out-bundle/BUNDLE-SHA256SUMS
