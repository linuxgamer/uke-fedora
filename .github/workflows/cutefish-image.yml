name: Cutefish unstable test image (manual)
run-name: Cutefish unstable · ${{ inputs.phase }} · COPR ${{ inputs.kernel_rpm }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Check source contracts and host capacity, or compose a test image
        type: choice
        options: [preflight, compose]
        default: preflight
      size_mib:
        description: Initial EXT4 filesystem capacity in MiB
        type: choice
        options: ['16384', '8192']
        default: '16384'
      kernel_rpm:
        description: COPR kernel version-release (latest or exact 7.3.x-N.fc46)
        type: string
        default: latest
      revision:
        description: Daily numeric image revision (0 produces r0; increment for different image contents)
        type: string
        default: '0'
permissions:
  contents: read
concurrency:
  group: ext4-singleboot-image
  cancel-in-progress: false
jobs:
  compose:
    if: github.ref == 'refs/heads/Fedora'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare disposable native ARM64 image host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd zip unzip e2fsprogs
          docker info
          df -h /
      - name: Check source contracts and budget composition
        env:
          IMAGE_SIZE_MIB: ${{ inputs.size_mib }}
        run: |
          set -euo pipefail
          case "$IMAGE_SIZE_MIB" in 8192|16384) ;; *) exit 2;; esac
          for test in public-root-packages desktop-isolation languages public-stage-routing public-build-contract first-boot-policy cutefish-passive-icons release-layout repository-kernel-identity repository-kernel-plan hosted-desktop-selection; do
            bash "uke-fedora-builder/tests/$test.sh"
          done
          available=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          peak=$((IMAGE_SIZE_MIB * 3 + 10240))
          reserve=8192
          printf 'available_mib=%s peak_growth_mib=%s reserve_mib=%s\n' "$available" "$peak" "$reserve" | tee -a "$GITHUB_STEP_SUMMARY"
          df -i "$RUNNER_TEMP"
          inodes=$(df -Pi "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          case "$inodes" in ''|*[!0-9]*) exit 2;; esac
          test "$inodes" -ge 1000000
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          df -h "$RUNNER_TEMP" "$docker_root" /tmp
          test "$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')" = "$(df -P "$docker_root" | awk 'NR==2 {print $1}')"
          free -h
          test "$available" -ge "$((peak + reserve))"
      - name: Compose and validate signed-package EXT4 singleboot image
        if: inputs.phase == 'compose'
        id: image
        env:
          IMAGE_CHANNEL: unstable
          IMAGE_DESKTOP: cutefish
          IMAGE_SHELL: bash
          IMAGE_SIZE_MIB: ${{ inputs.size_mib }}
          IMAGE_KERNEL_RPM: ${{ inputs.kernel_rpm }}
          IMAGE_REVISION: ${{ inputs.revision }}
        run: bash uke-fedora-builder/scripts/hosted-image.sh
      - name: Retain validated image and receipts
        if: inputs.phase == 'compose'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-singleboot-release
          path: ${{ steps.image.outputs.release_dir }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain image manifests and build records
        if: inputs.phase == 'compose'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-receipts-cutefish-r${{ inputs.revision }}
          path: ${{ steps.image.outputs.release_dir }}/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Retain failed-stage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-singleboot-diagnostics
          path: ${{ runner.temp }}/uke-build/*/*.log
          retention-days: 7
          if-no-files-found: ignore
