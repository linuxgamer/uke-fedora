name: EXT4 singleboot image and release (manual)
run-name: EXT4 singleboot · ${{ inputs.desktop }} · COPR ${{ inputs.kernel_rpm }}
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Original Fedora graphical session
        type: choice
        options: [kde, gnome, cutefish, nextkde]
        default: kde
      login_shell:
        description: Login shell for new accounts
        type: choice
        options: [bash, fish, zsh]
        default: bash
      size_mib:
        description: Initial EXT4 filesystem capacity in MiB
        type: choice
        options: ['16384', '8192']
        default: '16384'
      kernel_rpm:
        description: COPR kernel version-release (latest or exact 7.3.x-N.fc46)
        type: string
        default: latest
      revision:
        description: Daily numeric image revision (0 produces r0; increment for different image contents)
        type: string
        default: '0'
      publish:
        description: Publish validated files as a GitHub pre-release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ext4-singleboot-image
  cancel-in-progress: false
jobs:
  compose:
    if: github.ref == 'refs/heads/Fedora'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare disposable native ARM64 image host
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
          docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd
          docker info
          df -h /
      - name: Compose and validate signed-package EXT4 singleboot image
        id: image
        env:
          IMAGE_DESKTOP: ${{ inputs.desktop }}
          IMAGE_SHELL: ${{ inputs.login_shell }}
          IMAGE_SIZE_MIB: ${{ inputs.size_mib }}
          IMAGE_KERNEL_RPM: ${{ inputs.kernel_rpm }}
          IMAGE_REVISION: ${{ inputs.revision }}
        run: bash uke-fedora-builder/scripts/hosted-image.sh
      - name: Retain validated image and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-singleboot-release
          path: ${{ steps.image.outputs.release_dir }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain image manifests and build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-receipts-${{ inputs.desktop }}-r${{ inputs.revision }}
          path: ${{ steps.image.outputs.release_dir }}/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Retain failed-stage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ext4-singleboot-diagnostics
          path: ${{ runner.temp }}/uke-build/*/*.log
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: compose
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare publication verification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zstd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ext4-singleboot-release
          path: delivery
      - name: Verify and publish the completed pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash uke-fedora-builder/scripts/publish-image-release.sh delivery | tee -a "$GITHUB_STEP_SUMMARY"
