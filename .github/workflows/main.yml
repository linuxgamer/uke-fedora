name: Interactive Terminal (ARM)

on:
  push:
    branches:
      - main          # change to your branch, or use ['**'] for all branches
  workflow_dispatch:  # manual trigger from Actions tab

jobs:
  debug-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30   # prevents the job hanging forever if you don't connect

    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
