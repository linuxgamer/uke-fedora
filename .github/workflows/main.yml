name: ARM64 SSH Session via Bore Tunnel

on:
  push:
    branches: [ main ]

jobs:
  ssh-session:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bore
        run: |
          BORE_VERSION="0.6.0"
          wget -q "https://github.com/ekzhang/bore/releases/download/v${BORE_VERSION}/bore-v${BORE_VERSION}-aarch64-unknown-linux-musl.tar.gz"
          tar -xzf "bore-v${BORE_VERSION}-aarch64-unknown-linux-musl.tar.gz"
          sudo mv bore /usr/local/bin/
          rm "bore-v${BORE_VERSION}-aarch64-unknown-linux-musl.tar.gz"

      - name: Setup SSH Server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          echo "runner:runner" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -D &

      - name: Start Bore Tunnel & Keep Session Alive
        run: |
          echo "========== SSH CONNECTION INFO =========="
          echo "Username: runner"
          echo "Password: runner"
          echo "Starting bore tunnel on port 22..."
          echo "=========================================="
          
          # Start bore in the background and log output
          bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          
          # Wait for the tunnel to be established
          for i in {1..30}; do
            if grep -q "listening at bore.pub:" /tmp/bore.log; then
              echo "✅ Tunnel established!"
              PORT=$(grep -oP 'listening at bore\.pub:\K\d+' /tmp/bore.log)
              echo ""
              echo "Your SSH connection command is:"
              echo "ssh -p ${PORT} runner@bore.pub"
              break
            fi
            echo "Waiting for tunnel... ($i/30)"
            sleep 2
          done
          
          echo ""
          echo "🟢 Session active. You have up to 6 hours to connect."
          echo "🛑 Cancel the workflow run to end the session."
          
          # Keep the job alive
          sleep 21600
