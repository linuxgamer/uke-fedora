name: Interactive Terminal (ARM)
on:
  workflow_dispatch:

jobs:
  debug-arm:
    # Use the ARM64 Ubuntu runner label
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
