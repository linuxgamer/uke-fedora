name: Debug ARM Runner via Cloudflare Tunnel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: debug-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH via Cloudflare Tunnel
        uses: valeriangalliat/action-sshd-cloudflared@v4
