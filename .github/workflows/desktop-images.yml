name: Parallel shared-core desktop images (manual)
run-name: Shared core → GNOME and Plasma → validated images · r${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      kernel_rpm:
        description: Exact signed COPR kernel version-release, or latest (resolved once)
        type: string
        default: latest
      revision:
        description: New daily revision; existing different image bytes are never overwritten
        type: string
        default: '2'
      core_run_id:
        description: Optional completed series run with a successful core job to reuse without rebuilding
        type: string
        default: ''
      kde_run_id:
        description: Optional completed series run containing a validated KDE delivery
        type: string
        default: ''
      gnome_run_id:
        description: Optional completed series run containing a validated GNOME delivery
        type: string
        default: ''
      size_mib:
        description: EXT4 capacity in MiB, identical for every desktop
        type: choice
        options: ['8192', '16384']
        default: '8192'
      publish:
        description: Append each validated desktop to a common experimental image-only Release
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ext4-singleboot-image
  cancel-in-progress: false
jobs:
  core:
    if: github.ref == 'refs/heads/Fedora'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    outputs:
      build_date: ${{ steps.core.outputs.build_date }}
      producer_builder: ${{ steps.core.outputs.producer_builder }}
      producer_workspace: ${{ steps.core.outputs.producer_workspace }}
      producer_run_id: ${{ steps.core.outputs.producer_run_id }}
      core_sha256: ${{ steps.core.outputs.core_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare disposable ARM64 host
        env:
          CORE_RUN_ID: ${{ inputs.core_run_id }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          if [[ -z "$CORE_RUN_ID" ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/boost
            docker image prune --all --force
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd unzip
          df -h /
      - name: Assemble or verify the explicit frozen common core
        id: core
        env:
          IMAGE_KERNEL_RPM: ${{ inputs.kernel_rpm }}
          IMAGE_SIZE_MIB: ${{ inputs.size_mib }}
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$CORE_RUN_ID" ]]; then
            bash uke-fedora-builder/scripts/reuse-verified-core.sh
          else
            bash uke-fedora-builder/scripts/hosted-core.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-core-internal
          path: ${{ steps.core.outputs.core_archive }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain common-core provenance and actual RPM inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-core-receipts
          path: |
            ${{ steps.core.outputs.core_receipts }}/core-origin.json
            ${{ steps.core.outputs.core_receipts }}/core-installed-rpms.tsv
            ${{ steps.core.outputs.core_receipts }}/request.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain failed core diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-core-diagnostics
          path: ${{ runner.temp }}/uke-build/*/*.log
          retention-days: 7
  kde:
    needs: core
    uses: ./.github/workflows/desktop-image-stage.yml
    permissions:
      contents: read
      actions: read
    with:
      desktop: kde
      core_sha256: ${{ needs.core.outputs.core_sha256 }}
      reuse_run_id: ${{ inputs.kde_run_id }}
      core_producer: ${{ needs.core.outputs.producer_builder }}
      core_workspace: ${{ needs.core.outputs.producer_workspace }}
      core_run_id: ${{ needs.core.outputs.producer_run_id }}
      build_date: ${{ needs.core.outputs.build_date }}
      kernel_rpm: ${{ inputs.kernel_rpm }}
      size_mib: ${{ inputs.size_mib }}
      revision: ${{ inputs.revision }}
  gnome:
    needs: core
    uses: ./.github/workflows/desktop-image-stage.yml
    permissions:
      contents: read
      actions: read
    with:
      desktop: gnome
      core_sha256: ${{ needs.core.outputs.core_sha256 }}
      reuse_run_id: ${{ inputs.gnome_run_id }}
      core_producer: ${{ needs.core.outputs.producer_builder }}
      core_workspace: ${{ needs.core.outputs.producer_workspace }}
      core_run_id: ${{ needs.core.outputs.producer_run_id }}
      build_date: ${{ needs.core.outputs.build_date }}
      kernel_rpm: ${{ inputs.kernel_rpm }}
      size_mib: ${{ inputs.size_mib }}
      revision: ${{ inputs.revision }}
  verify_artifacts:
    needs: [core, kde, gnome]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zstd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-delivery-kde
          path: delivery/kde
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-delivery-gnome
          path: delivery/gnome
      - name: Validate both independent desktops and one shared boot without publishing
        id: verified
        env:
          CORE_SHA: ${{ needs.core.outputs.core_sha256 }}
          UKE_DESKTOP_SET_POLICY: gnome-plasma
        shell: bash
        run: |
          set -Eeuo pipefail
          joined="$RUNNER_TEMP/verified-desktop-set"
          bash uke-fedora-builder/scripts/merge-desktop-deliveries.sh "$joined" "$CORE_SHA" delivery/kde delivery/gnome
          boot=$(jq -er .boot "$joined/receipts/layout.json")
          boot_dir="$RUNNER_TEMP/shared-boot"
          mkdir "$boot_dir"
          cp "$joined/assets/$boot" "$boot_dir/"
          cp "$joined/receipts/cohort.json" "$boot_dir/"
          (cd "$boot_dir"; sha256sum "$boot" > SHA256SUMS)
          printf 'Use this boot only with the GNOME or KDE system image from this same Actions run. System images target userdata; flashing userdata erases its existing data. Verify the device, partition sizes and intended boot slot before any write. Hardware validation remains pending.\n' > "$boot_dir/README.txt"
          printf 'boot_dir=%s\nreceipts=%s\n' "$boot_dir" "$joined/receipts" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-boot
          path: ${{ steps.verified.outputs.boot_dir }}/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-desktop-set-receipts
          path: ${{ steps.verified.outputs.receipts }}/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: [core, kde, gnome]
    if: ${{ always() && !cancelled() && inputs.publish && needs.core.result == 'success' && needs.kde.result == 'success' && needs.gnome.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq zstd
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-delivery-kde
          path: delivery/kde
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-delivery-gnome
          path: delivery/gnome
      - name: Verify both independent desktops and one identical boot
        env:
          CORE_SHA: ${{ needs.core.outputs.core_sha256 }}
          UKE_DESKTOP_SET_POLICY: gnome-plasma
        run: |
          set -euo pipefail
          deliveries=(delivery/kde delivery/gnome)
          bash uke-fedora-builder/scripts/merge-desktop-deliveries.sh "$RUNNER_TEMP/desktop-set" "$CORE_SHA" "${deliveries[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-desktop-set-receipts
          path: ${{ runner.temp }}/desktop-set/receipts/
          retention-days: 90
          if-no-files-found: error
      - name: Publish exactly two validated desktop images and one shared boot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          UKE_REQUIRE_DESKTOP_SET: '1'
          UKE_DESKTOP_SET_POLICY: gnome-plasma
          UKE_EXPECTED_CORE_SHA: ${{ needs.core.outputs.core_sha256 }}
        run: |
          set -euo pipefail
          bash uke-fedora-builder/scripts/publish-image-release.sh "$RUNNER_TEMP/desktop-set" | tee -a "$GITHUB_STEP_SUMMARY"
