name: Validate workspace links
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Verify component checkouts and the public landing layout
        run: |
          set -euo pipefail
          for component in senemos-uke-kernel uke-fedora-builder uke-linux-hardware-support; do
            test -f "$component/README.md"
            git -C "$component" rev-parse --verify HEAD >/dev/null
          done
          test ! -e AGENTS.md
          test ! -e PLAN.md
          test ! -e packages
          test "$(git config -f .gitmodules --get submodule.uke-linux-hardware-support.path)" = uke-linux-hardware-support
          test ! -e senemeos.sh
          test -x senemos-uke-kernel/senemos.sh
          bash -n senemos-uke-kernel/senemos.sh
          test -x ukelinux.sh
          bash -n ukelinux.sh
      - name: Check Fedora 44 source entry points
        run: |
          set -euo pipefail
          bash -n uke-fedora-builder/build-fedora44-rootfs.sh
          bash -n uke-fedora-builder/build-fedora44-boot-a.sh
          uke-fedora-builder/build-fedora44-rootfs.sh --help >/dev/null
          uke-fedora-builder/build-fedora44-boot-a.sh --help >/dev/null
          grep -Fx 'Version: 7.2.11' senemos-uke-kernel/packaging/senemos-uke-linux-kernel-mainline.spec
