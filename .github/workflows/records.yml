name: Validate workspace links
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Verify the three active components
        run: |
          set -euo pipefail
          for component in senemos-uke-kernel uke-fedora-builder uke-linux-hardware-support; do
            test -f "$component/README.md"
            git -C "$component" rev-parse --verify HEAD >/dev/null
          done
          test "$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | wc -l)" -eq 3
          test ! -e recovery-uke-ofox
          test ! -e uke-project-aloha
          test ! -e uke-linux-images
      - name: Validate published entry points and userdata contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck
          bash senemos-uke-kernel/build.sh --help >/dev/null
          bash uke-fedora-builder/src/rootfs/entry.sh --help >/dev/null
          python3 uke-fedora-builder/src/userdata-boot/entry.py --help >/dev/null
          python3 uke-fedora-builder/scripts/tests/workspace-layout.py
          python3 uke-fedora-builder/scripts/tests/userdata-root-guard.py
          python3 uke-fedora-builder/scripts/tests/userdata-inventory.py
          shellcheck uke-fedora-builder/src/userdata-boot/*.sh
