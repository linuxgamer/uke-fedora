name: Full set
# Запускает три workflow по очереди и публикует всё в один release.
on:
  workflow_dispatch:
    inputs:
      release_tag: { description: "Release tag", default: "", type: string }
permissions:
  contents: write
jobs:
  kernel:
    uses: ./.github/workflows/kernel.yml
    with: { release_tag: "${{ inputs.release_tag }}" }
    secrets: inherit
  rootfs:
    needs: kernel
    uses: ./.github/workflows/rootfs.yml
    with: { release_tag: "${{ inputs.release_tag }}" }
    secrets: inherit
