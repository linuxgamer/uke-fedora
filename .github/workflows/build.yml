name: Build Baseline Bootable Image

# Manual only.  An image build takes roughly 25 minutes on a 50-minute arm64
# runner and produces several gigabytes, and GitHub disables workflows on forks
# whose inherited triggers look wasteful.  Start it deliberately, either here
# or through one of the image-* workflows.
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Comma-separated profiles to build (e.g. tty, kde)'
        required: true
        default: 'kde'
        type: string
      target:
        description: 'rpm = kernel RPMs only; boot = fedora_boot.img only; pair = rootfs plus both images'
        required: true
        default: 'boot'
        type: choice
        options:
          - boot
          - rpm
          - pair
  workflow_call:
    inputs:
      profiles:
        description: 'Comma-separated profiles to build'
        required: true
        type: string
      target:
        description: 'What to build: rpm, boot or pair'
        required: false
        default: 'pair'
        type: string
    outputs:
      artifact:
        description: 'Name of the artifact holding the requested images'
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profiles }}-${{ inputs.target || 'pair' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    outputs:
      artifact: uke-images-${{ github.run_id }}
    env:
      # A workflow_dispatch run reads inputs.target; a workflow_call run passes
      # it through.  The value selects which script runs, so it decides what is
      # compiled, not just what is published.
      TARGET: ${{ inputs.target || 'pair' }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodule legacy refs
        run: |
          git -C uke-linux-hardware-support fetch origin legacy-1.5.2:refs/tags/legacy-1.5.2 || true

      - name: Record component pins
        id: pins
        run: |
          {
            echo "kernel=$(git -C senemos-uke-kernel rev-parse HEAD)"
            echo "builder=$(git -C uke-fedora-builder rev-parse HEAD)"
            echo "hardware=$(git -C uke-linux-hardware-support rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch upstream touch core
        run: |
          bash uke-linux-hardware-support/uke-sensors/src/fetch-touch-core.sh

      - name: Restore build cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          # The builder keeps ccache under build/cache/ccache and the tool
          # images in the daemon's own store, so a paths entry for either
          # ~/.cache directory would always archive nothing. The per-component
          # source-cache trees are what make a run survive an upstream outage:
          # uke-sensors alone fetches libssc from codeberg.org, and run
          # 44253183775 died when that host stopped resolving.
          path: |
            senemos-uke-kernel/source-cache
            uke-fedora-builder/build/cache
            uke-linux-hardware-support/uke-sensors/source-cache
            uke-linux-hardware-support/uke-boot/source-cache
            uke-linux-hardware-support/uke-video/source-cache
            uke-linux-hardware-support/uke-desktop-packaging/source-cache
            uke-linux-hardware-support/uke-desktop-integration/source-cache
            uke-linux-hardware-support/xiaomi-uke-firmware/source-cache
          key: uke-cache-v3-${{ steps.pins.outputs.kernel }}-${{ steps.pins.outputs.builder }}-${{ github.run_id }}
          restore-keys: |
            uke-cache-v3-${{ steps.pins.outputs.kernel }}-${{ steps.pins.outputs.builder }}-
            uke-cache-v3-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq zstd g++ python3 python3-cryptography python3-pip e2fsprogs curl ca-certificates
          curl -fsSL 'https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT' \
            | base64 -d | sudo tee /usr/local/bin/avbtool >/dev/null
          sudo chmod +x /usr/local/bin/avbtool
          avbtool --help >/dev/null

      - name: Check product settings in the pinned components
        run: |
          mkdir -p uke-fedora-builder/build/cache
          python3 maint/prepare-ci-tree.py
          python3 maint/prepare-ci-fallback.py
          python3 maint/prepare-ci-kvm.py
          bash senemos-uke-kernel/tools/refresh-source-pins.sh
          sudo chmod -R 777 uke-fedora-builder/build/cache ~/.cache 2>/dev/null || true

      - name: Build baseline image
        env:
          PROFILES: ${{ inputs.profiles }}
          UKE_VIDEO_OVERLAY: '1'
          UKE_CONTAINER: docker
          UKE_COPR: '0'
        run: |
          set -Eeuo pipefail
          output="build/ci-$GITHUB_RUN_ID"
          mkdir -p build
          # Three separate scripts, one product each.  Picking the script here
          # rather than passing a mode keeps every target's stage plan intact:
          # a script only ever plans what it actually builds.
          case $TARGET in
            # The runner is arm64, so no --cross-kernel: that flag requires an
            # x86_64 host and each script rejects it otherwise.
            rpm)  ./uke-fedora-builder/build-rpms.sh --output "$output" ;;
            boot) ./uke-fedora-builder/build-boot-images.sh --profiles "$PROFILES" \
                      --parallel 1 --output "$output" ;;
            pair) ./uke-fedora-builder/build-images.sh --profiles "$PROFILES" \
                      --parallel 1 --output "$output" ;;
            *)    echo "Unknown target: $TARGET" >&2; exit 1 ;;
          esac

      - name: Save build cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            senemos-uke-kernel/source-cache
            uke-fedora-builder/build/cache
            uke-linux-hardware-support/uke-sensors/source-cache
            uke-linux-hardware-support/uke-boot/source-cache
            uke-linux-hardware-support/uke-video/source-cache
            uke-linux-hardware-support/uke-desktop-packaging/source-cache
            uke-linux-hardware-support/uke-desktop-integration/source-cache
            uke-linux-hardware-support/xiaomi-uke-firmware/source-cache
          key: uke-cache-v3-${{ steps.pins.outputs.kernel }}-${{ steps.pins.outputs.builder }}-${{ github.run_id }}

      - name: Package release archives
        if: success() && env.TARGET == 'pair'
        env:
          # zstd reads these for the tar --zstd child. Level 19 costs 9m07s on
          # the 4.4 GiB rootfs; level 12 keeps most of the saving for about
          # half the time, and split-release-assets.sh splits whatever comes
          # out, so a slightly larger archive only adds another part file.
          # Four threads because ZSTD_NBTHREADS=0 would mean one, not all.
          ZSTD_CLEVEL: '12'
          ZSTD_NBTHREADS: '4'
        run: |
          set -Eeuo pipefail
          tag="ci-$GITHUB_RUN_ID"
          ./uke-fedora-builder/tools/package-release.sh --tag "$tag" \
            --output "build/release-$tag" build/ci-$GITHUB_RUN_ID/*-pair
          ./tools/split-release-assets.sh \
            --input "build/release-$tag" --output "build/publish-$tag"

      - name: Publish release with direct download links
        id: publish
        if: success() && env.TARGET == 'pair'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag="ci-$GITHUB_RUN_ID"
          gh release create "$tag" build/publish-$tag/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Uke Fedora $tag" \
            --notes-file "build/publish-$tag/README.txt"

      - name: Collect requested images
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p publish
          shopt -s nullglob
          for pair in build/ci-*/*-pair; do
            profile=$(basename "$pair" | sed 's/-pair$//')
            # The builder already decided which images exist; copy what is
            # there instead of filtering again, so a boot-only output cannot
            # silently publish an empty set.
            for image in fedora_boot.img userdata.img; do
              [[ -f $pair/$image ]] || continue
              stem=${image%.img}
              cp "$pair/$image" "publish/${stem}-${profile}-$GITHUB_RUN_ID.img"
            done
            [[ -f $pair/manifest.json ]] && \
              cp "$pair/manifest.json" "publish/manifest-${profile}-$GITHUB_RUN_ID.json"
          done
          # The rpm target produces no image pair; its kernel RPM set is the
          # whole artifact.
          for dir in build/ci-*/kernel-rpms; do
            [[ -d $dir ]] || continue
            for rpm in "$dir"/*.rpm; do
              [[ -f $rpm ]] || continue
              cp "$rpm" publish/
            done
            [[ -f $dir/SHA256SUMS ]] && cp "$dir/SHA256SUMS" "publish/kernel-rpms-SHA256SUMS"
          done
          [[ -n $(ls -A publish 2>/dev/null) ]] || { echo 'Nothing was produced' >&2; exit 1; }
          # The status manifest records the kernel release each image expects,
          # which decides whether the other partition has to be refreshed too.
          find build/ci-* -maxdepth 1 -name 'status.json' -exec cp {} publish/ \; || true
          find build/ci-* -maxdepth 1 -name 'build.log' -exec cp {} publish/ \; || true
          ( cd publish; sha256sum ./* > SHA256SUMS )
          ls -lh publish

      - name: Upload requested images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uke-images-${{ github.run_id }}
          path: publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Uke Baseline Image Build"
            echo "- Profiles: \`${{ inputs.profiles }}\`"
            echo "- Target: \`$TARGET\`"
            echo "- Result: \`${{ job.status }}\`"
            if compgen -G 'publish/SHA256SUMS' >/dev/null; then
              echo
              echo '### Assets'
              echo '```'
              cat publish/SHA256SUMS 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
